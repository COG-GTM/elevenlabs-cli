[workspace]
members = ["cargo:.", "cargo:elevenlabs-types", "cargo:elevenlabs-sdk"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Build each app with `cargo build --package` instead of a workspace-wide
# build. Without this, cargo-dist also compiles the non-distributed root
# crate, whose default features pull in native-tls/OpenSSL and break the
# musl builds.
precise-builds = true
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Whether to enable GitHub Attestations
github-attestations = true
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Publish jobs to run (npm publishing deferred until pipeline is validated)
publish-jobs = ["homebrew"]
# Prereleases must not reach brew/scoop. A tap has no prerelease channel — a
# published manifest simply *is* the version `brew install elevenlabs` and
# `scoop install elevenlabs` hand out — so tagging a 1.1.0-rc.1 would serve an
# RC to every stable user. This was `true` during the alpha, when the taps were
# the distribution channel for testers and there was no stable release to
# clobber. Stable releases are unaffected either way; only prereleases are.
publish-prereleases = false
# Don't overwrite release.yml on `dist init` (preserves customizations)
allow-dirty = ["ci"]
# The archive format to use for windows builds (defaults .zip)
windows-archive = ".zip"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
default-features = false
features = ["rustls"]
tap = "elevenlabs/homebrew-tap"
formula = "elevenlabs"

# GitHub retired the macos-14 image dist defaults to for Apple Silicon builds
# (2026-11-02), and jobs on it are cancelled before they start.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# Actions dist writes into release.yml, pinned to full commit SHAs so a moved
# tag cannot change what runs in the release jobs. Keep these in sync with the
# `uses:` lines in .github/workflows/release.yml (version in the comment there).
[dist.github-action-commits]
"actions/attest-build-provenance" = "977bb373ede98d70efdf65b84cb5f73e068dcc2a" # v3.0.0
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/download-artifact" = "37930b1c2abaa49bbe596cd826c3c89aef350131" # v7.0.0
"actions/upload-artifact" = "ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
